kind = "mobile"
previewPath = "/mobile/"
title = "SentConnect Mobile"
version = "1.0.0"
id = "artifacts/sentconnect-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 25386

[services.development]
run = "pnpm --filter @workspace/sentconnect-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sentconnect-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/sentconnect-mobile", "run", "serve" ]

[services.env]
PORT = "25386"
BASE_PATH = "/mobile/"
