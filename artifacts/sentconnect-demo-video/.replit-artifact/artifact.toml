kind = "video"
previewPath = "/sentconnect-demo-video/"
title = "SentConnect Demo Video"
version = "1.0.0"
id = "artifacts/sentconnect-demo-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sentconnect-demo-video/" ]
localPort = 24268

[services.development]
run = "pnpm --filter @workspace/sentconnect-demo-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sentconnect-demo-video", "run", "build" ]
publicDir = "artifacts/sentconnect-demo-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24268"
BASE_PATH = "/sentconnect-demo-video/"
