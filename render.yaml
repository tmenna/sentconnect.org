services:
  - type: web
    name: sentconnect.org
    plan: free
    runtime: node
    region: oregon
    branch: main
    buildCommand: npm install -g pnpm && pnpm install && pnpm --filter @workspace/api-server run build && BASE_PATH=/help/ pnpm --filter @workspace/sentconnect-slides run build && pnpm --filter @workspace/mission-reports run build
    startCommand: pnpm --filter @workspace/api-server run start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
